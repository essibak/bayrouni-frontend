<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — أكاديمية البيروني</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --teal: #1D9E75; --td: #085041; --bg: #F5F4EF; --wh: #fff; --dk: #1a1a18;
      --gm: #D3D1C7; --gl: #EBEBE4; --r: 16px;
      --font: 'Cairo', system-ui, sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--dk); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .auth-card { background: var(--wh); padding: 40px; border-radius: var(--r); box-shadow: 0 8px 30px rgba(0,0,0,0.06); width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--gm); }
    .logo-icon { font-size: 44px; margin-bottom: 12px; display: block; }
    h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px; color: var(--td); }
    p { font-size: 14px; color: #5F5E5A; margin-bottom: 28px; }
    .input-group { margin-bottom: 16px; text-align: right; }
    .input-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 14px; border: 1px solid var(--gm); border-radius: 10px; font-family: var(--font); font-size: 14px; box-sizing: border-box; outline: none; transition: 0.2s; direction: rtl;}
    .input-group input:focus { border-color: var(--teal); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 12px; }
    .btn-primary { background: var(--teal); color: var(--wh); }
    .btn-primary:hover { background: var(--td); }
    #error-msg { color: #D85A30; font-size: 13px; font-weight: 700; margin-bottom: 16px; display: none; background: #FAECE7; padding: 10px; border-radius: 8px; }
    .get-code { margin-top: 20px; font-size: 13px; color: #5F5E5A; }
    .get-code a { color: var(--teal); font-weight: bold; text-decoration: none; }
    .get-code a:hover { text-decoration: underline; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-card">
    <span class="logo-icon">🌿</span>
    <h1>أكاديمية البيروني</h1>
    <p>أدخل اسمك وكود الدخول الخاص بك</p>

    <div id="error-msg"></div>

    <div class="input-group">
      <label>الاسم الكامل</label>
      <input type="text" id="fullName" placeholder="مثال: أيمن بوزيان" />
    </div>
    <div class="input-group">
      <label>كود الدخول (الكود السري)</label>
      <input type="password" id="accessCode" placeholder="أدخل الكود المكون من حروف وأرقام" dir="ltr" style="text-align: left;" />
    </div>

    <button class="btn btn-primary" onclick="loginWithCode()">دخول لمنصتي</button>

    <div class="get-code">
      ليس لديك كود دخول؟ <a href="pricing.html">احصل عليه الآن</a>
    </div>
  </div>

  <script>
// ═══════════════════════════════════
// 1. إعداد الاتصال الحقيقي بقاعدة البيانات
// ═══════════════════════════════════
const SUPABASE_URL = 'https://ggredrfictkcbizvwhre.supabase.co';
// ⚠️ ضع مفتاحك الطويل والصحيح هنا بين علامتي التنصيص
const SUPABASE_ANON_KEY = 'sb_publishable_TeURCc0iuZujdSC6r58jHA_AO_MAHgD'; 
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let remotePhone = '';

// ═══════════════════════════════════
// 2. دوال الواجهة والتنقل (من Claude)
// ═══════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}
function back(to) { show(to); }

function selectType(type) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('tb-'+type).classList.add('sel');
  setTimeout(() => show('s1-'+type), 180);
}

function goTrial() { show('s4-trial'); }
function goLogin() { show('s3-login'); }
function goToPricing() { window.location.href = 'pricing.html'; }
function contactWhatsApp() { window.open('https://wa.me/212600000000', '_blank'); }
function enterDashboard() { window.location.href = 'dashboard.html'; }

function setLoading(btnId, spinnerId, on) {
  const sp = document.getElementById(spinnerId);
  if (sp) sp.style.display = on ? 'block' : 'none';
  if (btnId) {
    const btn = document.getElementById(btnId);
    if (btn) {
      btn.disabled = on;
      const span = btn.querySelector('span');
      if (span) span.style.opacity = on ? '0' : '1';
    }
  }
}

function shake(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('err');
  el.animate([
    {transform:'translateX(0)'}, {transform:'translateX(-6px)'},
    {transform:'translateX(6px)'}, {transform:'translateX(-4px)'},
    {transform:'translateX(0)'}
  ], {duration:300, easing:'ease'});
  el.focus();
  setTimeout(() => el.classList.remove('err'), 1500);
}

function showSuccess(title, name, sub, cta) {
  document.getElementById('success-title').textContent = title;
  document.getElementById('success-name').textContent = name;
  document.getElementById('success-sub').innerHTML = sub.replace(/\n/g,'<br/>');
  document.getElementById('success-cta').textContent = cta;
  show('s-success');
}

// ═══════════════════════════════════
// 3. محرك تسجيل الدخول (السحر الحقيقي)
// ═══════════════════════════════════
async function loginWithSupabase(code, name, btnId, spinnerId, successMsg, isTrial = false) {
  setLoading(btnId, spinnerId, true);
  
  // تنظيف الكود وتحويله لإيميل وهمي
  const cleanCode = code.toLowerCase().replace(/[^a-z0-9]/g, '');
  const pseudoEmail = cleanCode + "@biruni.ma";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: pseudoEmail,
    password: cleanCode
  });

  setLoading(btnId, spinnerId, false);

  if (error) {
    return false; // فشل الدخول
  } else {
    // تحديث الاسم في قاعدة البيانات
    if (name) {
      await supabaseClient.auth.updateUser({ data: { full_name: name } });
    }
    showSuccess(
      'أهلاً بك يا ' + (name || 'بطل') + '!',
      name || '',
      successMsg,
      'ادخل للوحة التحكم 🚀'
    );
    return true; // نجاح الدخول
  }
}

// -- دخول تلميذ المركز --
async function submitCenter() {
  const code = document.getElementById('center-code').value.trim();
  const name = document.getElementById('center-name').value.trim();
  
  if (!code) { shake('center-code'); return; }
  if (!name) { shake('center-name'); return; }

  const success = await loginWithSupabase(code, name, 'center-btn', 'center-spinner', '🏫 تلميذ المركز · وصول مجاني كامل\nسعيدون بانضمامك لأكاديمية البيروني 🌿');
  if (!success) {
    shake('center-code');
    const st = document.getElementById('center-code-status');
    st.style.display = 'block'; st.style.background = 'var(--cl)'; st.style.color = 'var(--cor)';
    st.textContent = '❌ الكود غير صحيح، تأكد من كتابته بشكل سليم.';
  }
}

// -- دخول تلميذ عن بعد (نظهر شاشة الهاتف الوهمية كنوع من الفخامة ثم نسجل دخوله) --
function submitRemote() {
  const name  = document.getElementById('remote-name').value.trim();
  const phone = document.getElementById('remote-phone').value.trim();
  const code  = document.getElementById('remote-code').value.trim();

  if (!name)  { shake('remote-name');  return; }
  if (!phone || phone.length < 10) { shake('remote-phone'); return; }
  if (!code)  { shake('remote-code');  return; }

  remotePhone = phone;
  setLoading('remote-btn', 'remote-spinner', true);
  setTimeout(() => {
    setLoading('remote-btn', 'remote-spinner', false);
    document.getElementById('otp-phone-display').textContent = phone;
    show('s2-otp'); // الذهاب لشاشة الكود
    document.getElementById('otp0').focus();
  }, 600);
}

// -- تأكيد رقم الهاتف لتلميذ عن بعد --
async function verifyOTP() {
  const otpCode = [0,1,2,3].map(i => document.getElementById('otp'+i).value).join('');
  if (otpCode.length < 4) return;

  const code = document.getElementById('remote-code').value.trim();
  const name = document.getElementById('remote-name').value.trim();

  const success = await loginWithSupabase(code, name, null, 'otp-spinner', '🌐 تعلّم عن بُعد · تم التحقق بنجاح ✅');
  if (!success) {
    document.getElementById('otp-err').style.display = 'block';
    document.getElementById('otp-err').textContent = 'كود الاشتراك غير صالح، تأكد من اشتراكك.';
    document.querySelectorAll('.code-box').forEach(b => b.classList.add('err'));
  }
}

// -- تسجيل الدخول العادي --
async function submitLogin() {
  const name = document.getElementById('login-name').value.trim();
  const code = document.getElementById('login-code').value.trim();

  if (!name) { shake('login-name'); return; }
  if (!code) { shake('login-code'); return; }

  const success = await loginWithSupabase(code, name, 'login-btn-main', 'login-spinner', 'تم التحقق بنجاح ✅');
  if (!success) {
    alert('❌ الاسم أو الكود غير صحيح. تأكد من معلوماتك.');
  }
}

// -- التجربة المجانية --
async function startTrial() {
  const name = document.getElementById('trial-name').value.trim();
  if (!name) { shake('trial-name'); return; }

  // نستخدم حساب التجربة الذي أنشأناه سابقا trial2026
  await loginWithSupabase('trial2026', name, null, 'trial-spinner', '🎁 تجربة مجانية محدودة\n6 دروس · 10 رسائل ذكاء اصطناعي', true);
}

// نقل تلقائي للخانات في شاشة الهاتف
function otpNav(inp, idx) {
  inp.classList.toggle('filled', inp.value.length > 0);
  if (inp.value && idx < 3) document.getElementById('otp'+(idx+1)).focus();
  if (idx === 3 && inp.value) verifyOTP();
}

// تنسيق تلقائي للكود
document.querySelectorAll('[id$="-code"]').forEach(inp => {
  inp.addEventListener('input', function() {
    let v = this.value.replace(/[^A-Z0-9]/ig,'').toUpperCase();
    this.value = v;
  });
});

// التعامل مع الروابط القادمة من الرئيسية
(function() {
  const p = new URLSearchParams(window.location.search);
  const mode = p.get('mode');
  if (mode === 'trial') setTimeout(() => show('s4-trial'), 100);
  else if (mode === 'login') setTimeout(() => show('s3-login'), 100);
})();      }
    }
  </script>
</body>
</html>

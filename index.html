<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أكاديمية البيروني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- 1. شاشة تسجيل الدخول / إنشاء حساب -->
    <div id="auth-section" class="bg-white p-8 rounded-3xl shadow-lg border border-gray-100 max-w-md w-full text-center">
        <div class="text-5xl mb-4">🚀</div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">أكاديمية البيروني</h2>
        <p class="text-gray-500 mb-8">سجل دخولك لمتابعة دروسك ونقاطك</p>

        <div class="space-y-4 text-right">
            <div>
                <label class="block text-gray-700 font-bold mb-2">البريد الإلكتروني</label>
                <input type="email" id="email" class="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-blue-500 outline-none text-left" dir="ltr" placeholder="student@example.com">
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">كلمة المرور</label>
                <input type="password" id="password" class="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-blue-500 outline-none text-left" dir="ltr" placeholder="********">
            </div>
        </div>

        <div id="auth-error" class="mt-4 text-red-500 font-bold text-sm hidden-view"></div>

        <div class="mt-8 space-y-3">
            <button onclick="logIn()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">تسجيل الدخول</button>
            <button onclick="signUp()" class="w-full bg-orange-100 text-orange-600 py-3 rounded-xl font-bold hover:bg-orange-200 transition">إنشاء حساب جديد</button>
        </div>
    </div>

    <!-- 2. لوحة تحكم التلميذ (مخفية في البداية) -->
    <div id="dashboard-section" class="hidden-view w-full h-screen flex flex-col items-center justify-center">
        <div class="bg-white p-10 rounded-3xl shadow-lg text-center max-w-2xl w-full border border-gray-100">
            <h1 class="text-4xl font-bold text-green-600 mb-4">🎉 أهلاً بك في الأكاديمية!</h1>
            <p class="text-xl text-gray-600 mb-2">لقد تم تسجيل دخولك بنجاح وربطك بقاعدة البيانات.</p>
            <p class="text-gray-500 font-bold mb-8">البريد: <span id="user-email-display" class="text-blue-600"></span></p>
            
            <button onclick="logOut()" class="bg-red-50 text-red-600 px-8 py-3 rounded-xl font-bold hover:bg-red-100 transition">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        // === إعداد اتصال Supabase ===
        // ضع مفاتيحك هنا بدلاً من النصوص بين علامتي التنصيص
        const SUPABASE_URL = 'https://ggredrfictkcbizvwhre.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TeURCc0iuZujdSC6r58jHA_AO_MAHgD';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // واجهات النظام
        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const errorDiv = document.getElementById('auth-error');

        // === 1. دالة إنشاء الحساب (Sign Up) ===
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            errorDiv.classList.add('hidden-view');

            if(!email || !password) {
                showError("الرجاء إدخال البريد وكلمة المرور");
                return;
            }

            // إرسال البيانات لقاعدة البيانات
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                showError(error.message);
            } else {
                alert("تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.");
            }
        }

        // === 2. دالة تسجيل الدخول (Log In) ===
        async function logIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            errorDiv.classList.add('hidden-view');

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                showError("البيانات غير صحيحة، تأكد من البريد وكلمة المرور.");
            } else {
                showDashboard(data.user.email);
            }
        }

        // === 3. دالة تسجيل الخروج (Log Out) ===
        async function logOut() {
            await supabase.auth.signOut();
            authSection.classList.remove('hidden-view');
            dashboardSection.classList.add('hidden-view');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // إظهار الأخطاء
        function showError(msg) {
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden-view');
        }

        // إظهار لوحة التحكم بعد الدخول
        function showDashboard(email) {
            authSection.classList.add('hidden-view');
            dashboardSection.classList.remove('hidden-view');
            document.getElementById('user-email-display').innerText = email;
        }
    </script>
</body>
</html>
